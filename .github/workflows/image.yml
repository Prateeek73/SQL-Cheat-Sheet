# Builds the image the platform's jobs and app run: ghcr.io/prateeek73/sql-cheat-sheet.
name: image

on:
  push:
    branches: [main]
    paths: [Dockerfile, pyproject.toml, requirements.txt, 'sqlcs/**', 'scripts/**', 'queries/**', 'docs/**', .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/prateeek73/sql-cheat-sheet:latest
            ghcr.io/prateeek73/sql-cheat-sheet:${{ github.sha }}
