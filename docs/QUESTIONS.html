<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="SQL practice questions loaded from the repository files so GitHub Pages can render them without hard-coded query text.">
  <title>SQL Practice — Questions Index</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfaf9;
      --fg: #1a1917;
      --mut: #6b6862;
      --line: #e5e1db;
      --card: #ffffff;
      --accent: #b8532a;
      --accent-soft: rgba(184, 83, 42, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --fg: #eceae6;
        --mut: #9a958c;
        --line: #2c2a27;
        --card: #1e1d1a;
        --accent: #e08155;
        --accent-soft: rgba(224, 129, 85, 0.2);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    .pagehead { display: flex; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 3vw, 2.5rem); line-height: 1.1; }
    .lede { margin: 0; max-width: 70ch; color: var(--mut); }
    .tot { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    .tot div { min-width: 8rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-size: 1.35rem; font-weight: 700; }
    .tot span { display: block; margin-top: .2rem; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
    .toolbar { display: flex; gap: .5rem; margin: 1rem 0 1.1rem; }
    .tbtn { border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: .45rem .7rem; border-radius: 999px; cursor: pointer; font: inherit; }
    .tbtn:hover { border-color: var(--accent); color: var(--accent); }
    .tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.2rem 0 1.5rem; }
    .tab { display: flex; align-items: center; gap: .5rem; border: 1px solid var(--line); background: var(--card); color: var(--mut); border-radius: 999px; padding: .45rem .75rem; cursor: pointer; font: inherit; box-shadow: var(--shadow); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tnum { display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .78rem; font-weight: 700; }
    .tab.active .tnum { background: rgba(255,255,255,.2); color: #fff; }
    .tcount { color: inherit; opacity: .8; font-variant-numeric: tabular-nums; }
    .project { margin-top: 1rem; }
    .phead { display: flex; gap: 1rem; align-items: center; border-bottom: 2px solid var(--line); padding-bottom: .8rem; margin-bottom: 1rem; }
    .pnum { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; }
    .phead h2 { margin: 0; font-size: 1.3rem; }
    .meta { margin: .2rem 0 0; color: var(--mut); font-size: .92rem; }
    .meta code { color: var(--accent); }
    .project-intro { margin-bottom: 1.2rem; color: var(--mut); }
    .project-intro code { color: var(--accent); }
    .level-block { margin-bottom: 1.4rem; }
    .lvlhead { border-left: 4px solid var(--accent); padding-left: .7rem; margin-bottom: .8rem; }
    .lvlhead h3 { margin: 0; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; }
    .lvlhead .count { color: var(--mut); font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: .35rem; }
    .card-grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); }
    .question-card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); padding: .3rem 0; }
    .question-card summary { list-style: none; cursor: pointer; padding: .8rem .9rem; display: grid; gap: .35rem; }
    .question-card summary::-webkit-details-marker { display: none; }
    .question-card .qn { color: var(--accent); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
    .question-card .q { font-size: .95rem; color: var(--fg); line-height: 1.4; }
    .question-card .file { color: var(--mut); font-size: .76rem; display: flex; justify-content: space-between; gap: 1rem; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .question-card .go { color: var(--accent); font-weight: 600; }
    .question-body { padding: 0 .9rem .9rem; }
    .question-toolbar { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .5rem; }
    .question-meta { margin: 0; color: var(--mut); font-size: .85rem; }
    .question-meta code { color: var(--accent); }
    .copy-sql { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 999px; padding: .3rem .6rem; font: inherit; cursor: pointer; }
    .copy-sql:hover { border-color: var(--accent); background: rgba(184,83,42,.08); }
    .schema-shell { margin: 1rem 0 1.6rem; padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
    .schema-head h3 { margin: 0 0 .2rem; font-size: .95rem; }
    .schema-head p { margin: 0; color: var(--mut); font-size: .85rem; }
    .schema-grid { display: grid; gap: .8rem; margin-top: .85rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    .schema-card { border: 1px solid var(--line); border-radius: 10px; padding: .75rem; background: rgba(0,0,0,.02); }
    .schema-card h4 { margin: 0 0 .55rem; font-size: .9rem; }
    .schema-fields { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
    .schema-field { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; font-size: .8rem; padding: .35rem .4rem; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
    .schema-field-primary { border-color: rgba(184,83,42,.35); background: rgba(184,83,42,.08); }
    .schema-field-foreign { border-color: rgba(63,125,58,.35); background: rgba(63,125,58,.08); }
    .schema-field-conjunction, .schema-field-composite { border-color: rgba(122,92,196,.35); background: rgba(122,92,196,.08); }
    .field-name { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 600; }
    .field-type { color: var(--mut); font-size: .72rem; }
    .key-badge { margin-left: auto; border-radius: 999px; font-size: .68rem; font-weight: 700; padding: .15rem .4rem; letter-spacing: .04em; color: var(--card); background: var(--accent); }
    .schema-field-foreign .key-badge { background: #3f7d3a; }
    .schema-field-conjunction .key-badge, .schema-field-composite .key-badge { background: #7a5cc4; }
    .field-ref { flex-basis: 100%; color: var(--mut); font-size: .72rem; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    pre.sql { margin: 0; padding: .8rem; border-radius: 10px; overflow-x: auto; background: rgba(0,0,0,.03); border: 1px solid var(--line); font-size: .8rem; line-height: 1.55; white-space: pre; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .error { color: #b9534b; padding: 1rem; border: 1px solid rgba(185,83,75,.2); border-radius: 12px; background: rgba(185,83,75,.08); }
    @media (max-width: 760px) {
      .pagehead { flex-direction: column; }
      .tot { width: 100%; }
      .tot div { flex: 1 1 8rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="pagehead">
      <div>
        <h1>SQL Practice — Questions Index</h1>
        <p class="lede">This page reads the question metadata and SQL from the repository files. GitHub Pages can render it without you hard-coding every query into the HTML.</p>
      </div>
      <div class="tot">
        <div id="question-count">0<span>questions</span></div>
        <div id="project-count">0<span>projects</span></div>
        <div id="source-rows">0<span>source rows</span></div>
      </div>
    </header>

    <div class="toolbar">
      <button class="tbtn" data-action="expand" type="button">Expand all</button>
      <button class="tbtn" data-action="collapse" type="button">Collapse all</button>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="projects"></div>
  </div>

  <script src="./questions-render.js"></script>
</body>
</html>
