[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-cheat-sheet"
version = "0.1.0"
description = "113 SQL practice queries on five real Kaggle datasets (SQLite), with a bucket-backed pipeline and site"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "kaggle>=2.2", "boto3>=1.34"]

[project.scripts]
sqlcs = "sqlcs.__main__:main"

# The command runs the scripts in scripts/ of the checkout it is installed from
# (pip install -e .), or of the image (/app).
[tool.setuptools]
packages = ["sqlcs"]
